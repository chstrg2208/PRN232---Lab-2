services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - lms_network
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PRN232_LMS_DB;User Id=sa;Password=Your_password123;TrustServerCertificate=True;MultipleActiveResultSets=true
      - JWT_SECRET=${JWT_SECRET:-PRN232_Advanced_REST_API_And_Security_JWT_Secret_Key_2026_Prod}
      - Jwt__SecretKey=${JWT_SECRET:-PRN232_Advanced_REST_API_And_Security_JWT_Secret_Key_2026_Prod}
      - Jwt__Issuer=PRN232.LMS.API
      - Jwt__Audience=PRN232.LMS.Client
      - Jwt__ExpiryMinutes=60
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - sqlserver
    networks:
      - lms_network
    restart: always

volumes:
  sqlserver_data:

networks:
  lms_network:
    driver: bridge
